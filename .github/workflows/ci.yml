name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (compile · import · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install runtime + dev dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        working-directory: backend
        run: python -m compileall app

      - name: Import check
        working-directory: backend
        run: python -c "import app.main; print('backend import passed')"

      - name: Tests
        working-directory: backend
        run: python -m pytest tests -v

  compose:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml with throwaway secrets
        env:
          # Temporary, single-run values — never real credentials.
          SECRET_KEY: ci-temporary-secret-key-with-at-least-32-characters
          POSTGRES_PASSWORD: ci-temporary-postgres-password
        run: |
          docker compose config >/dev/null && echo "compose config OK"
          docker compose config --services

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend, compose]
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        env:
          SECRET_KEY: ci-temporary-secret-key-with-at-least-32-characters
          POSTGRES_PASSWORD: ci-temporary-postgres-password
        run: docker compose build

      - name: Start stack and check health
        env:
          SECRET_KEY: ci-temporary-secret-key-with-at-least-32-characters
          POSTGRES_PASSWORD: ci-temporary-postgres-password
        run: |
          docker compose up -d
          sleep 25
          docker compose ps
          curl --retry 10 --retry-delay 3 --retry-connrefused -fsS http://localhost:8000/api/health
          echo
          curl --retry 10 --retry-delay 3 --retry-connrefused -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:8080/

      - name: Collect logs (always, for diagnosis)
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down
