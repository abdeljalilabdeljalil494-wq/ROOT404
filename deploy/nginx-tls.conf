# Staging/production example; operator supplies trusted certificate/key externally.
server {
    listen 80;
    server_name _;
    location = /health { access_log off; return 200 'ok\n'; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/root404/tls/server.pem;
    ssl_certificate_key /etc/root404/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 10m;
    client_body_timeout 10s;
    # Never log authorization-code query strings or authentication bodies.
    access_log off;
    location = /ready { proxy_pass http://backend:8000/ready; add_header Cache-Control no-store always; }
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /oauth/callback/ {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files $uri /index.html;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
