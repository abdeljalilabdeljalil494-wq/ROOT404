x-logging: &bounded_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database - Hardened
  db:
    logging: *bounded_logging
    image: postgres:15-alpine
    container_name: root404_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root404}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-root404}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root404}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: false  # Postgres needs write
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - backend_network

  # Redis for optional cache/readiness; authentication state is SQL-backed
  redis:
    logging: *bounded_logging
    image: redis:7-alpine
    container_name: root404_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    networks:
      - backend_network

  # Backend API - Hardened
  backend:
    logging: *bounded_logging
    image: root404-backend:private-beta
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: root404_backend
    environment: &backend_environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-root404}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-root404}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      JUDGE_ENABLED: ${JUDGE_ENABLED:-false}
      JUDGE_URL: ${JUDGE_URL:-}
      JUDGE_EXPECTED_IMAGE: ${JUDGE_EXPECTED_IMAGE:-}
      JUDGE_SHARED_SECRET: ${JUDGE_SHARED_SECRET:-}
      MENTOR_RETENTION_DAYS: ${MENTOR_RETENTION_DAYS:-30}
      SUBMISSION_RETENTION_DAYS: ${SUBMISSION_RETENTION_DAYS:-90}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SEED_DEMO_DATA: "false"
      ENABLE_DEMO_FEATURES: "false"
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/.cache:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend_network
      - frontend_network

  # Operator-approved compose up runs migrations before API startup; never create_all.
  migrate:
    image: root404-backend:private-beta
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend_environment
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend_network]

  # Manual stdin JSON job only; dedicated host dispatcher is in executor_service/.
  judge:
    profiles: ["legacy-judge-cli"]
    build:
      context: ./judge_sandbox
      dockerfile: Dockerfile.runner
    read_only: true
    network_mode: none
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /workspace:rw,nosuid,size=64m,uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    restart: "no"

  # Frontend - Hardened Nginx
  frontend:
    logging: *bounded_logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: root404_frontend
    ports:
      - "127.0.0.1:8080:80"
    environment:
      VITE_API_URL: /api
      VITE_API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=20m
      - /tmp:noexec,nosuid,size=20m
    networks:
      - frontend_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend_network:
    name: root404_backend
    internal: false
  frontend_network:
    name: root404_frontend
    internal: false
