version: '3.8'

services:
  # PostgreSQL Database - Hardened
  db:
    image: postgres:15-alpine
    container_name: root404_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root404}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root404_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-root404}
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost, not 0.0.0.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root404}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: false  # Postgres needs write
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - backend_network

  # Redis for OTP and caching - Hardened
  redis:
    image: redis:7-alpine
    container_name: root404_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_change_me} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD:-redis_secret_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    networks:
      - backend_network

  # Backend API - Hardened
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: root404_backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-root404}:${POSTGRES_PASSWORD:-root404_secret_change_me}@db:5432/${POSTGRES_DB:-root404}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_change_me}@redis:6379/0
      JUDGE_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/.cache:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - backend_network
      - frontend_network

  # Judge Runner - Maximum Isolation
  judge:
    build:
      context: ./judge_sandbox
      dockerfile: Dockerfile.runner
    container_name: root404_judge
    environment:
      JUDGE_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - judge_workspace:/workspace:rw,noexec,nosuid
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /run:noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Would use custom seccomp profile in prod
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    # No network for security - absolute isolation
    networks:
      - no_internet
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    # Prevent privilege escalation
    user: "1000:1000"

  # Frontend - Hardened Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: root404_frontend
    ports:
      - "80:80"
      - "127.0.0.1:5173:80"
    environment:
      VITE_API_URL: /api
      VITE_API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=50m
      - /var/run:noexec,nosuid,size=20m
      - /tmp:noexec,nosuid,size=20m
    networks:
      - frontend_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  judge_workspace:
    driver: local

networks:
  backend_network:
    name: root404_backend
    internal: false
  frontend_network:
    name: root404_frontend
    internal: false
  no_internet:
    internal: true
    name: root404_no_internet
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
